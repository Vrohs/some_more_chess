name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The GUI crate links against GTK4 and libadwaita; the core crate does
      # not, but a workspace build needs both present.
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The interface layer is where every shipped defect has lived, and none
      # of it is reachable from a unit test. This builds the real views and
      # clicks the real board, under a virtual display.
      - name: Interface self-test
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a cargo run --release -- selftest
